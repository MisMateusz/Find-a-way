<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Labirynt dla dwojga</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  </head>
  <body>
    <main id="app">
      <!-- EKRAN: start -->
      <section class="screen" data-screen="home">
        <h1>Find-a-way</h1>
        <p class="lead">Jedna osoba widzi mapę, druga się po niej porusza.</p>
        <button id="create">Utwórz lobby</button>
        <div class="join">
          <label for="code">Kod lobby</label>
          <input id="code" maxlength="8" autocomplete="off" />
          <button id="join">Dołącz</button>
        </div>
      </section>

      <!-- EKRAN: lobby -->
      <section class="screen" data-screen="lobby" hidden>
        <h2>Lobby</h2>
        <p>Kod do przekazania drugiej osobie:</p>
        <p class="code" id="lobby-code">K7QF</p>
        <p id="lobby-status" class="lead">Czekam na drugiego gracza…</p>
        <fieldset>
          <legend>Twoja rola</legend>
          <label><input type="radio" name="role" value="mapper" checked /> Mapper</label>
          <label><input type="radio" name="role" value="explorer" /> Eksplorer</label>
          <label><input type="radio" name="role" value="random" /> Losowo</label>
        </fieldset>
        <fieldset>
          <legend>Poziom</legend>
          <label><input type="radio" name="level" value="5" checked /> Łatwy (5x5)</label>
          <label><input type="radio" name="level" value="7" /> Średni (7x7)</label>
          <label><input type="radio" name="level" value="9" /> Trudny (9x9)</label>
          <label><input type="radio" name="level" value="11" /> Ekspert (11x11)</label>
          <label><input type="radio" name="level" value="random" /> Losowo</label>
        </fieldset>
        <button id="start">Start</button>
      </section>

      <!-- EKRAN: mapper -->
      <section class="screen" data-screen="mapper" hidden>
        <h2>Mapper</h2>
        <p class="lead">Dotknij lewej połowy kafelka, żeby obrócić go w lewo, prawej, żeby w prawo.</p>
        <p class="time" id="timer1">00:00</p>
        <div class="board" id="board-mapper"></div>
      </section>

      <!-- EKRAN: eksplorer -->
      <section class="screen" data-screen="explorer" hidden>
        <div class="bar">
          <h2>Eksplorer</h2>
          <p class="time" id="timer2">00:00</p>
        </div>
        <div class="board" id="board-explorer"></div>
        <div class="dpad" aria-label="Sterowanie">
          <button data-move="N" aria-label="W górę">↑</button>
          <button data-move="W" aria-label="W lewo">←</button>
          <button data-move="S" aria-label="W dół">↓</button>
          <button data-move="E" aria-label="W prawo">→</button>
          <button class="diag" data-move="NW" aria-label="W lewo i w górę" hidden>↖</button>
          <button class="diag" data-move="NE" aria-label="W prawo i w górę" hidden>↗</button>
          <button class="diag" data-move="SW" aria-label="W lewo i w dół" hidden>↙</button>
          <button class="diag" data-move="SE" aria-label="W prawo i w dół" hidden>↘</button>
        </div>
      </section>

      <!-- EKRAN: wynik -->
      <section class="screen" data-screen="result" hidden>
        <h2 id="result-title">Koniec gry</h2>
        <p id="result-text" class="lead"></p>
        <p class="time" id="result-time">00:00</p>
        <button data-go="lobby">Rewanż</button>
        <button data-go="home" class="secondary">Wyjdź</button>
      </section>
    </main>

    <!-- Pasek deweloperski: skakanie między ekranami. Usuń przed publikacją. -->
    <nav class="dev" aria-label="Podgląd ekranów (tymczasowy)">
      <button data-go="home">start</button>
      <button data-go="lobby">lobby</button>
      <button data-go="mapper">mapper</button>
      <button data-go="explorer">eksplorer</button>
      <button data-go="result">wynik</button>
    </nav>

    

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
