<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Find-a-way</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  </head>
  <body>
    <main id="app">
      <!-- EKRAN: start -->
      <section class="screen" data-screen="home">
        <h1>Find-a-way</h1>
        <p class="lead">Two people: <br> One sees the map, the other moves through maze.</p>
        <button id="create">Create lobby</button>
        <div class="join">
          <label for="code">Lobby code</label>
          <input id="code" maxlength="8" autocomplete="off" />
          <button id="join">Join</button>
        </div>
      </section>

      <!-- EKRAN: lobby -->
      <section class="screen" data-screen="lobby" hidden>
        <h2>Lobby</h2>
        <p>Lobby code:</p>
        <p class="code" id="lobby-code">K7QF</p>
        <p id="lobby-status" class="lead">Waiting for the second player…</p>
        <fieldset id="role-set">
          <legend >Roles</legend>
          <label><input type="radio" name="role" value="mapper" /> Mapper</label>
          <label><input type="radio" name="role" value="explorer" /> Explorer</label>
          <label><input type="radio" name="role" value="random" /> Random</label>
        </fieldset>
        <fieldset>
          <legend>Level</legend>
          <label><input type="radio" name="level" value="5" /> Easy (5x5)</label>
          <label><input type="radio" name="level" value="7" /> Medium (7x7)</label>
          <label><input type="radio" name="level" value="9" /> Hard (9x9)</label>
          <label><input type="radio" name="level" value="11" /> Expert (11x11)</label>
          <label><input type="radio" name="level" value="random" /> Random</label>
        </fieldset>
        <button id="start">Start</button>
      </section>

      <!-- EKRAN: mapper -->
      <section class="screen" data-screen="mapper" hidden>
        <h2>Mapper</h2>
        <p class="lead">Tap the left half of a tile to rotate it left, the right half to rotate it right.</p>
        <p class="time" id="timer1">00:00</p>
        <div class="board" id="board-mapper"></div>
      </section>

      <!-- EKRAN: eksplorer -->
      <section class="screen" data-screen="explorer" hidden>
        <div class="bar">
          <h2>Eksplorer</h2>
          <p class="time" id="timer2">00:00</p>
        </div>
        <div class="board" id="board-explorer"></div>
        <div class="dpad" aria-label="Sterowanie">
          <button data-move="N" aria-label="W górę"><img src="arrows/nArrow.png" alt="up" id="upArrow"></button>
          <button data-move="W" aria-label="W lewo"><img src="arrows/nArrow.png" alt="left" id="leftArrow"></button>
          <button data-move="S" aria-label="W dół"><img src="arrows/nArrow.png" alt="down" id="downArrow"></button>
          <button data-move="E" aria-label="W prawo"><img src="arrows/nArrow.png" alt="right" id="rightArrow"></button>
          <button class="diag" data-move="NW" aria-label="W lewo i w górę" hidden><img src="arrows/dArrow.png" alt="up-left" id="upLeftArrow"></button>
          <button class="diag" data-move="NE" aria-label="W prawo i w górę" hidden><img src="arrows/dArrow.png" alt="up-right" id="upRightArrow"></button>
          <button class="diag" data-move="SW" aria-label="W lewo i w dół" hidden><img src="arrows/dArrow.png" alt="down-left" id="downLeftArrow"></button>
          <button class="diag" data-move="SE" aria-label="W prawo i w dół" hidden><img src="arrows/dArrow.png" alt="down-right" id="downRightArrow"></button>
        </div>
      </section>

      <!-- EKRAN: wynik -->
      <section class="screen" data-screen="result" hidden>
        <h2 id="result-title">Finish</h2>
        <p id="result-text" class="lead"></p>
        <p class="time" id="result-time">00:00</p>
        <button data-go="lobby">Play Again</button>
        <button data-go="home" class="secondary">Exit</button>
        <div id="save-box" class="join" hidden>
        <label for="nick">Nick</label>
        <input id="nick" maxlength="16" autocomplete="off" />
        <button id="save">Zapisz wynik</button>
        </div>
        <p class="lead" id="top-title"></p>
        <ol id="top"></ol>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
